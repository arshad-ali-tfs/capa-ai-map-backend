[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capa-ai-map-backend"
version = "0.1.0"
description = "Independent MAP API and historical deviation clustering pipeline"
requires-python = ">=3.11.5,<3.12"
dependencies = [
  "fastapi==0.162.5",
  "uvicorn==0.54.0",
  "numpy==2.2.6",
  "pandas==2.2.3",
  "scipy==1.15.3",
  "scikit-learn==1.6.1",
  "numba==0.61.2",
  "umap-learn==0.5.12",
  "pynndescent==0.6.0",
  "faiss-cpu==1.15.0",
  "beautifulsoup4==4.15.0",
  "contractions==0.1.73",
  "langdetect==1.0.9",
  "python-dotenv==1.2.4",
  "openai==2.54.0",
  "sentence-transformers==5.7.0",
  "langchain-text-splitters==1.1.3",
  "spacy==3.8.18",
  "openpyxl==3.1.5",
  "psutil==7.2.2",
  "filelock==4.2.10",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1"]
databricks = ["databricks-sdk>=0.89,<1"]

[project.scripts]
map-api = "capa_map.cli:serve"
map-import = "capa_map.cli:import_source"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["map_pipeline", "run_map", "prepare_assets"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["capa_map*", "map_core*"]

[tool.setuptools.package-data]
map_core = ["prompt_templates/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
